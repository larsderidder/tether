name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CODEX_SDK_REF: 2338f99f58bdb120ff11e511b5a77328b68e61e8

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: agent
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: agent
        run: pytest --cov=tether --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: agent/coverage.xml
          fail_ci_if_error: false

  test-sidecars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the Codex SDK used by the sidecar
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: ${{ env.CODEX_SDK_REF }}
          path: codex-src
          sparse-checkout: sdk/typescript
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install sidecar dependencies
        run: npm ci
      - name: Check sidecar types
        run: npm run typecheck --workspaces
      - name: Run sidecar tests
        run: npm test --workspaces

  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Check UI types
        working-directory: ui
        run: npm run typecheck
      - name: Run UI tests
        working-directory: ui
        run: npm run test:run

  build:
    runs-on: ubuntu-latest
    needs: [test, test-sidecars, test-ui]

    steps:
      - uses: actions/checkout@v4
      - name: Check out the same Codex SDK verified by the sidecar tests
        uses: actions/checkout@v4
        with:
          repository: openai/codex
          ref: ${{ env.CODEX_SDK_REF }}
          path: codex-src
          sparse-checkout: sdk/typescript

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        working-directory: agent
        run: pip install build

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Copy UI to agent
        run: |
          rm -rf agent/tether/static_ui
          cp -r ui/dist agent/tether/static_ui

      - name: Install sidecar dependencies
        run: npm install --workspaces

      - name: Build sidecar bundles
        run: ./scripts/build-sidecars.sh

      - name: Sync README for PyPI
        run: |
          cp README.md agent/README.md
          sed -i 's|src="tether_compact_logo.png"|src="https://raw.githubusercontent.com/larsderidder/tether/main/tether_compact_logo.png"|' agent/README.md

      - name: Build package
        working-directory: agent
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: agent/dist/
